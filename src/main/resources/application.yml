spring:
  application:
    name: gdrn
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
      file-size-threshold: 0
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.orm.jdbc.bind: OFF
gdrn:
  reporting:
    attachments:
      root: ${REPORT_ATTACHMENT_STORAGE_ROOT:.data/report-attachments}
