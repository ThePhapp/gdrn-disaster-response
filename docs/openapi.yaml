# Bản đặc tả đã đối chiếu ứng dụng; nguồn và giới hạn ở docs/PHASE1_REVIEW.md.
openapi: 3.0.3
info:
  title: "API GDRN Pha 1"
  version: 1.0.0
  description: "API nghiệp vụ đã triển khai tại main 2ddf9d0: E01–E20. Đã đối chiếu bộ điều khiển, bộ phân tích, DTO và cấu hình bảo mật. Đăng nhập công khai; các thao tác khác cần Bearer JWT. JWT HS256 có tuổi thọ 900 giây, không làm mới. Lỗi dùng đối tượng JSON ApiError của dự án, không theo RFC 7807. Vai trò được mô tả bằng x-roles; bearerAuth không có phạm vi OAuth. URL sức khỏe và Swagger nằm trong README, ngoài đặc tả nghiệp vụ này. Thiết kế P00 gốc ở docs/api/phase1-contract.yaml. Tải ảnh cần proxy chấp nhận kích thước tệp; Nginx hiện có thể trả 413 trước khi tới API."
servers:
- url: /
  description: "API cùng nguồn qua Vite/Nginx; cũng dùng được trên Swagger của ứng dụng"
- url: http://127.0.0.1:8080
  description: "Địa chỉ trực tiếp mặc định của ứng dụng; thay APP_PORT theo cấu hình"
security:
- bearerAuth: []
tags:
- name: Identity
  description: "Đăng nhập và người dùng hiện tại"
- name: Disaster
  description: "Vòng đời thảm họa"
- name: Reporting
  description: "Báo cáo, xác minh, rút báo cáo và bộ lọc không gian"
- name: Rescue
  description: "Đội sẵn sàng, phân công và tiến độ nhiệm vụ"
- name: Dashboard
  description: "Thống kê toàn hệ thống chỉ đọc cho điều phối viên"
- name: Evidence
  description: "Ảnh báo cáo riêng tư, siêu dữ liệu và nội dung nhị phân có phân quyền"
paths:
  /api/auth/login:
    post:
      operationId: E01
      summary: E01 POST /api/auth/login
      tags:
      - Identity
      description: "Chuẩn hóa email theo EmailAddress; sai mật khẩu, người dùng không tồn tại hoặc vai trò MVP không hoạt động đều trả 401 INVALID_CREDENTIALS. Tuổi thọ 900 giây, không làm mới. Phản hồi Cache-Control: no-store."
      x-owner: Person 1
      x-task: P01
      x-roles:
      - PUBLIC
      x-consumers:
      - S01
      responses:
        '200':
          description: "Thành công."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityLoginResponse'
              example:
                accessToken: <issued-jwt-not-a-real-token>
                tokenType: Bearer
                expiresIn: 900
                expiresAt: '2026-10-08T03:15:00Z'
                user:
                  id: 00000000-0000-4000-8000-000000000001
                  email: citizen.one@example.test
                  role: CITIZEN
          headers:
            Cache-Control:
              description: "Không lưu đệm dữ liệu người dùng."
              schema:
                type: string
                enum:
                - no-store
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
              example:
                timestamp: '2026-10-08T03:00:00Z'
                status: 400
                code: VALIDATION_ERROR
                message: Request could not be completed.
                path: /api/auth/login
                fieldErrors:
                - field: body
                  message: Invalid request shape.
          headers:
            Cache-Control:
              description: "Không lưu đệm dữ liệu người dùng."
              schema:
                type: string
                enum:
                - no-store
        '401':
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
              example:
                timestamp: '2026-10-08T03:00:00Z'
                status: 401
                code: INVALID_CREDENTIALS
                message: Request could not be completed.
                path: /api/auth/login
                fieldErrors: []
          headers:
            Cache-Control:
              description: "Không lưu đệm dữ liệu người dùng."
              schema:
                type: string
                enum:
                - no-store
        '415':
          description: UNSUPPORTED_MEDIA_TYPE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
              example:
                timestamp: '2026-10-08T03:00:00Z'
                status: 415
                code: UNSUPPORTED_MEDIA_TYPE
                message: Request could not be completed.
                path: /api/auth/login
                fieldErrors: []
          headers:
            Cache-Control:
              description: "Không lưu đệm dữ liệu người dùng."
              schema:
                type: string
                enum:
                - no-store
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
              example:
                timestamp: '2026-10-08T03:00:00Z'
                status: 500
                code: INTERNAL_ERROR
                message: Request could not be completed.
                path: /api/auth/login
                fieldErrors: []
          headers:
            Cache-Control:
              description: "Không lưu đệm dữ liệu người dùng."
              schema:
                type: string
                enum:
                - no-store
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityLoginRequest'
            example:
              email: citizen.one@example.test
              password: <from-demo-environment>
