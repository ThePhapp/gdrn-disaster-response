# Reviewed runtime snapshot; see docs/PHASE1_REVIEW.md for provenance and limits.
openapi: 3.0.3
info:
  title: GDRN Phase 1 API
  version: 1.0.0
  description: 'Implemented business API at main 2ddf9d0 (2026-10-28): E01-E20. Reviewed against controllers, parsers,
    DTOs and security configuration. Public login; all other operations require a Bearer JWT. JWT HS256 TTL 900
    seconds, no refresh. Errors use the project ApiError JSON object, not RFC 7807. Role metadata is documented
    by x-roles; bearerAuth has no OAuth scopes. Health and Swagger infrastructure URLs are described in README and
    are outside this business specification. The original P00 design remains in docs/api/phase1-contract.yaml. Attachment
    success requires a proxy accepting the upload size; current Nginx config may reject larger bodies with 413 before
    the API.'
servers:
- url: /
  description: Same-origin API via Vite/Nginx; also works on backend Swagger
- url: http://127.0.0.1:8080
  description: Default direct backend; override APP_PORT as configured
security:
- bearerAuth: []
tags:
- name: Identity
  description: Login and current user
- name: Disaster
  description: Disaster lifecycle
- name: Reporting
  description: Reports, verification, withdrawal and spatial filters
- name: Rescue
  description: Team availability, assignment and mission progress
- name: Dashboard
  description: Authority read-only global statistics
- name: Evidence
  description: Private report images, authorized metadata and binary content
paths:
  /api/auth/login:
