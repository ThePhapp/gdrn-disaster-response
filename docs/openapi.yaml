      description: "Chỉ AUTHORITY. Gửi cả from/to (YYYY-MM-DD, năm 0001–9999, from <= to) hoặc bỏ cả hai. Tính cả hai ngày theo Asia/Ho_Chi_Minh. Không lọc ngày thì from/to phản hồi là null. Báo cáo lọc created_at, loại đã rút; nhiệm vụ lọc assigned_at. Số đếm phản ánh trạng thái hiện tại của nhóm được chọn, không phải chuyển trạng thái lịch sử. Số đội luôn phản ánh mọi đội hiện tại bất kể khoảng ngày. Dùng một ảnh chụp REPEATABLE READ chỉ đọc. Khóa truy vấn lạ/lặp/rỗng, ngày sai hoặc có thân yêu cầu trả 400."
      parameters:
      - name: from
        in: query
        required: false
        description: "Ngày bắt đầu, tính cả ngày này; phải có ngày kết thúc. Bỏ cả hai để lấy toàn thời gian."
        schema:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        example: '2026-10-01'
      - name: to
        in: query
        required: false
        description: "Ngày kết thúc, tính cả ngày này; phải có ngày bắt đầu. Bỏ cả hai để lấy toàn thời gian."
