          $ref: '#/components/schemas/RescueId'
        teamId:
          $ref: '#/components/schemas/RescueId'
      required:
      - reportId
      - teamId
      example:
        reportId: 00000000-0000-4000-8000-000000000005
        teamId: 00000000-0000-4000-8000-000000000006
    RescueUpdateMissionStatusRequest:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - ASSIGNED
          - IN_PROGRESS
          - COMPLETED
      required:
      - status
      example:
        status: IN_PROGRESS
    RescueMission:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/RescueId'
        reportId:
          $ref: '#/components/schemas/RescueId'
        teamId:
          $ref: '#/components/schemas/RescueId'
        status:
          $ref: '#/components/schemas/RescueMissionStatus'
        assignedAt:
          $ref: '#/components/schemas/RescueTimestamp'
        startedAt:
          $ref: '#/components/schemas/RescueTimestamp'
        completedAt:
          $ref: '#/components/schemas/RescueTimestamp'
        updatedAt:
          $ref: '#/components/schemas/RescueTimestamp'
      required:
      - id
      - reportId
      - teamId
      - status
      - assignedAt
      - updatedAt
      description: "ASSIGNED không có startedAt/completedAt. IN_PROGRESS bắt buộc startedAt, không có completedAt. COMPLETED bắt buộc cả startedAt và completedAt."
    RescueMissionPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RescueMission'
          maxItems: 100
        page:
          type: integer
          minimum: 0
          maximum: 1000000
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
    RescueError:
      type: object
      additionalProperties: false
      properties:
        timestamp:
          $ref: '#/components/schemas/RescueTimestamp'
        status:
          type: integer
        code:
          type: string
        message:
          type: string
        path:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - field
            - message
      required:
      - timestamp
      - status
      - code
      - message
      - path
      - fieldErrors
    DashboardSummary:
      type: object
      additionalProperties: false
      required:
      - from
      - to
      - timeZone
      - asOf
      - reports
      - missions
      - teams
      properties:
        from:
          type: string
          format: date
          nullable: true
        to:
          type: string
          format: date
          nullable: true
        timeZone:
          type: string
          enum:
          - Asia/Ho_Chi_Minh
        asOf:
          type: string
          format: date-time
        reports:
          type: object
          additionalProperties: false
          required:
          - pending
          - verified
          - rejected
          properties:
            pending:
              type: integer
              format: int64
              minimum: 0
            verified:
              type: integer
              format: int64
              minimum: 0
            rejected:
              type: integer
              format: int64
              minimum: 0
        missions:
          type: object
          additionalProperties: false
          required:
          - assigned
          - inProgress
          - completed
          properties:
            assigned:
              type: integer
              format: int64
              minimum: 0
            inProgress:
              type: integer
              format: int64
              minimum: 0
            completed:
              type: integer
              format: int64
              minimum: 0
        teams:
          type: object
          additionalProperties: false
          required:
          - available
          - busy
          properties:
            available:
              type: integer
              format: int64
              minimum: 0
            busy:
              type: integer
              format: int64
              minimum: 0
  parameters:
    ReportingReportId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ReportingId'
    ReportingAttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ReportingId'
  responses:
    ReportingAttachmentValidation:
      description: "Thiếu tệp ảnh hoặc tệp không hợp lệ."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportingError'
    ReportingForbidden:
      description: "Từ chối truy cập."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportingError'
    ReportingNotFound:
      description: "Không tìm thấy báo cáo hoặc ảnh đính kèm."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportingError'
    ReportingAttachmentConflict:
      description: "Đã đạt giới hạn ảnh hoặc báo cáo không còn được chỉnh sửa."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportingError'
    ReportingAttachmentTooLarge:
      description: "Ảnh vượt 5 MiB."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportingError'
    ReportingAttachmentFormat:
      description: "Chỉ chấp nhận ảnh JPEG và PNG."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportingError'
    ReportingAttachmentStorage:
      description: "Thao tác lưu trữ riêng tư thất bại."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportingError'
