      operationId: E01
      summary: E01 POST /api/auth/login
      tags:
      - Identity
      description: 'Email normalized as EmailAddress; invalid password, unknown user or inactive MVP role: identical
        401 INVALID_CREDENTIALS. TTL 900 seconds, no refresh. Response Cache-Control: no-store.'
      x-owner: Person 1
      x-task: P01
      x-roles:
      - PUBLIC
      x-consumers:
      - S01
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityLoginResponse'
              example:
                accessToken: <issued-jwt-not-a-real-token>
                tokenType: Bearer
                expiresIn: 900
                expiresAt: '2026-10-08T03:15:00Z'
                user:
                  id: 00000000-0000-4000-8000-000000000001
                  email: citizen.one@example.test
                  role: CITIZEN
          headers:
            Cache-Control:
              description: Do not cache user data.
              schema:
                type: string
                enum:
                - no-store
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
              example:
                timestamp: '2026-10-08T03:00:00Z'
                status: 400
                code: VALIDATION_ERROR
                message: Request could not be completed.
                path: /api/auth/login
                fieldErrors:
                - field: body
                  message: Invalid request shape.
          headers:
            Cache-Control:
              description: Do not cache user data.
              schema:
                type: string
                enum:
                - no-store
        '401':
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
              example:
                timestamp: '2026-10-08T03:00:00Z'
                status: 401
                code: INVALID_CREDENTIALS
                message: Request could not be completed.
                path: /api/auth/login
                fieldErrors: []
          headers:
            Cache-Control:
              description: Do not cache user data.
              schema:
                type: string
                enum:
                - no-store
        '415':
          description: UNSUPPORTED_MEDIA_TYPE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityError'
              example:
                timestamp: '2026-10-08T03:00:00Z'
                status: 415
