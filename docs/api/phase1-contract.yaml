      x-roles:
      - AUTHORITY
      x-consumers:
      - S06
      x-status: planned
      responses:
        '200':
          description: "Thành công."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
              example:
                id: 00000000-0000-4000-8000-000000000007
                reportId: 00000000-0000-4000-8000-000000000005
                teamId: 00000000-0000-4000-8000-000000000006
                status: IN_PROGRESS
                assignedAt: '2026-10-08T03:00:00Z'
                updatedAt: '2026-10-08T03:02:00Z'
                startedAt: '2026-10-08T03:02:00Z'
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: "Không lưu đệm dữ liệu xác thực hoặc người dùng."
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-10-08T03:00:00Z'
                status: 400
                code: VALIDATION_ERROR
                message: Request could not be completed.
                path: /api/rescue-missions/00000000-0000-4000-8000-000000000005/status
                fieldErrors:
                - field: body
                  message: Invalid request shape.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: "Không lưu đệm dữ liệu xác thực hoặc người dùng."
        '401':
          description: UNAUTHENTICATED
