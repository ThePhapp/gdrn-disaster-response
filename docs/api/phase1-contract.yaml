              example:
                timestamp: '2026-10-08T03:00:00Z'
                status: 401
                code: UNAUTHENTICATED
                message: Request could not be completed.
                path: /api/rescue-missions/00000000-0000-4000-8000-000000000005/status
                fieldErrors: []
          headers:
            WWW-Authenticate:
              schema:
                type: string
                enum:
                - Bearer
              description: "Yêu cầu xác thực Bearer."
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: "Không lưu đệm dữ liệu xác thực hoặc người dùng."
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-10-08T03:00:00Z'
                status: 403
                code: FORBIDDEN
                message: Request could not be completed.
                path: /api/rescue-missions/00000000-0000-4000-8000-000000000005/status
                fieldErrors: []
          headers:
            Cache-Control:
