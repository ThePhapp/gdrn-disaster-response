                - no-store
              description: "Không lưu đệm dữ liệu xác thực hoặc người dùng."
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-10-08T03:00:00Z'
                status: 404
