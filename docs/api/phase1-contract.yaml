      x-task: P01
      x-roles:
      - PUBLIC
      x-consumers:
      - S01
      x-status: planned
      responses:
        '200':
          description: "Thành công."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                accessToken: <issued-jwt-not-a-real-token>
                tokenType: Bearer
                expiresIn: 900
                expiresAt: '2026-10-08T03:15:00Z'
                user:
                  id: 00000000-0000-4000-8000-000000000001
                  email: citizen.one@example.test
                  role: CITIZEN
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: "Không lưu đệm dữ liệu xác thực hoặc người dùng."
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-10-08T03:00:00Z'
                status: 400
                code: VALIDATION_ERROR
                message: Request could not be completed.
                path: /api/auth/login
                fieldErrors:
                - field: body
                  message: Invalid request shape.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: "Không lưu đệm dữ liệu xác thực hoặc người dùng."
        '401':
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-10-08T03:00:00Z'
                status: 401
                code: INVALID_CREDENTIALS
                message: Request could not be completed.
                path: /api/auth/login
                fieldErrors: []
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: "Không lưu đệm dữ liệu xác thực hoặc người dùng."
