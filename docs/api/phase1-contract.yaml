      tags:
      - P01
      description: "Chuẩn hóa email theo EmailAddress; sai mật khẩu, người dùng không tồn tại hoặc vai trò MVP không hoạt động đều trả 401 INVALID_CREDENTIALS. Tuổi thọ 900 giây, không làm mới. Phản hồi Cache-Control: no-store."
